# Builds the shopping list image and publishes it to this project's GitLab Container
# Registry ($CI_REGISTRY_IMAGE). Merge requests only build; the default branch
# publishes :latest, :<short sha> and :dev-<short sha>-<unix time> (sortable, for
# Flux image automation), and tags publish :<tag>.

stages: [build]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
    PLATFORMS: linux/amd64,linux/arm64
  before_script:
    - docker run --privileged --rm tonistiigi/binfmt --install arm64
    - docker context create builder-ctx
    - docker buildx create --use --name builder builder-ctx
  script:
    - |
      set -eu
      push=false
      tags="-t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        push=true
        tags="$tags -t $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      elif [ "${CI_COMMIT_BRANCH:-}" = "$CI_DEFAULT_BRANCH" ]; then
        push=true
        # dev-<sha>-<unix time>: sortable, for Flux image automation (ImagePolicy picks the newest)
        tags="$tags -t $CI_REGISTRY_IMAGE:latest -t $CI_REGISTRY_IMAGE:dev-$CI_COMMIT_SHORT_SHA-$(date +%s)"
      fi
      if [ "$push" = true ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      fi
      docker buildx build \
        --platform "$PLATFORMS" \
        --label org.opencontainers.image.source="$CI_PROJECT_URL" \
        --label org.opencontainers.image.revision="$CI_COMMIT_SHA" \
        $tags \
        --push="$push" \
        .
